services:
  pixeline:
    image: ghcr.io/kimmathiesen/pixeline-web:latest
    container_name: pixeline
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # dine Pixeline ISO-filer (læses kun)
      - /mnt/user/isos/pixeline:/isos:ro
      # de klargjorte spilfiler
      - /mnt/user/appdata/pixeline:/data
