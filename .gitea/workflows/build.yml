# Builds the image and pushes it to this Gitea's container registry on every push to main.
# Needs a repository secret REGISTRY_TOKEN: a Gitea access token with package write access.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registry name
        id: reg
        run: |
          host="${GITHUB_SERVER_URL#*://}"
          echo "host=${host%/}" >> "$GITHUB_OUTPUT"
          echo "image=${host%/}/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/pixeline-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.reg.outputs.image }}:latest
            ${{ steps.reg.outputs.image }}:${{ github.sha }}
